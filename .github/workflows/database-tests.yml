name: Database Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  database:
    name: Supabase migration and policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: database-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start local database
        run: supabase db start

      - name: Rebuild migration history twice
        run: |
          supabase db reset
          supabase db reset

      - name: Run database policy tests
        run: supabase test db

      - name: Verify generated database types
        run: node scripts/generate-database-types.mjs --check
