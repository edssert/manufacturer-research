name: Database Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  database:
    name: Supabase migration and policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: database-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install pinned tooling
        run: npm ci

      - name: Start local database
        run: npx supabase db start

      - name: Rebuild migration history twice
        run: |
          npx supabase db reset
          npx supabase db reset

      - name: Run database policy tests
        run: npx supabase test db

      - name: Verify K Series vertical slice
        run: npm run catalog:k-series:verify

      - name: Verify generated database types
        run: npm run db:types:check
